[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipal-vector"
version = "0.1.0"
description = "A small, dependency-free exact vector search engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Manipal03/manipal-vector"
Issues = "https://github.com/Manipal03/manipal-vector/issues"

[project.scripts]
manipal-vector = "vector_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["vector_engine*"]
